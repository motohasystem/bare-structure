<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筋交いの無い構造体</title>
    <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/+esm"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>筋交いの無い構造体</h1>
        <span class="title-note">角材を使った骨組み計画を補助します。筋交いは適宜追加してください。</span>
      </div>
    </header>
    <div class="layout">
      <aside class="panel">
        <h2 class="section-title">入力パラメータ</h2>
        <div class="form-grid">
          <label for="w">幅 (W)</label><input id="w" type="number" min="100" max="3000" value="800">
          <label for="d">奥行 (D)</label><input id="d" type="number" min="100" max="3000" value="600">
          <label for="h">高さ (H)</label><input id="h" type="number" min="100" max="3000" value="1000">
          <label for="mw">角材 幅</label><input id="mw" type="number" min="10" max="200" value="40">
          <label for="mt">角材 厚み</label><input id="mt" type="number" min="10" max="200" value="40">
          <label for="bt">板厚</label><input id="bt" type="number" min="1" max="200" value="12">
        </div>
        <div class="projection-mode">
          <span>表示:</span>
          <label><input type="radio" name="projectionMode" value="orthographic"> 正投影</label>
          <label><input type="radio" name="projectionMode" value="perspective" checked> 透視投影</label>
        </div>
        <div class="shelf-editor">
          <div class="shelf-editor-head">
            <span>棚板高さ (mm)</span>
            <div class="shelf-buttons">
              <button id="removeShelfBtn" type="button" aria-label="棚板を削除">-</button>
              <button id="addShelfBtn" type="button" aria-label="棚板を追加">+</button>
            </div>
          </div>
          <div id="shelfList" class="shelf-list"></div>
        </div>
        <div class="io-block">
          <div class="io-buttons">
            <button id="exportYamlBtn" type="button">YAML Export</button>
            <button id="importYamlBtn" type="button">YAML Import</button>
            <button id="resetBtn" type="button">Reset</button>
            <button id="exportCutlistBtn" type="button">CutList Copy</button>
          </div>
          <input id="importYamlFile" type="file" accept=".yaml,.yml,text/yaml,text/x-yaml" hidden>
        </div>

        <h2 class="section-title">カットリスト</h2>
        <table>
          <thead>
            <tr>
              <th>部材名</th>
              <th>長さ/寸法</th>
              <th>本数</th>
              <th>小計</th>
            </tr>
          </thead>
          <tbody id="cutRows"></tbody>
        </table>
        <div id="total" class="total"></div>
      </aside>
      <main class="viewer">
        <div id="viewport"></div>
        <div class="hint">
          左ドラッグ: 回転<br>
          ホイール: ズーム<br>
          棚段クリック+ドラッグ: 高さ移動
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
